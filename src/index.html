<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClickMeSpoool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
        <section class="altar">
            <p class="souls"><span id="soul-count">0</span> Souls</p>
            <p class="rate"><span id="soul-rate">0</span> per second</p>

            <button id="pumpkin" class="pumpkin" aria-label="Click the pumpkin">🎃</button>

            <p class="whisper" id="whisper">Go on. Click this shit</p>
        </section>

        <aside class="shop">
            <h2>Offering</h2>
            <ul id="shop-list"></ul>
            <button id="reset" class="reset">Reset</button>
        </aside>
    </main>

    <script src="data.js"></script>
    <script src="game.js"></script>
</body>
</html>
